aid: strider
name: Strider
description: 'Strider Technologies is a Salt Lake City, Utah strategic intelligence
  company founded in 2019 by former intelligence-community professionals. It transforms
  publicly available open-source data into AI-powered intelligence that helps government
  agencies, defense contractors, universities, financial institutions and Fortune 100
  enterprises identify and mitigate nation-state threats — primarily from China, Russia,
  North Korea and Iran — targeting their workforce, technology, supply chains and
  intellectual property. The Strider Strategic Intelligence Platform spans Insights,
  People Search, Organizations Search, Open Source Software Search, the Data Catalog,
  the Spark natural-language research agent, and Shield, a curated threat-intelligence
  dataset of high-risk emails, domains and multilingual keywords that is delivered via
  API into customer SIEM and DLP systems. The platform is sold direct and through AWS
  Marketplace under private pricing.'
